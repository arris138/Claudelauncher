[package]
name = "claude-launcher"
version = "4.2.0"
description = "A desktop launcher for Claude Code CLI"
authors = ["you"]
edition = "2021"

[lib]
name = "claude_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
chrono = "0.4"
tokio = { version = "1", features = ["time"] }
portable-pty = "0.8"
winreg = "0.52"
# Windows Credential Manager for per-project API keys (src/secrets.rs).
# windows-native only: the other backends are for platforms this app does not target.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Blocking HTTP for the OpenRouter usage calls (src/openrouter.rs). Deliberately
# Rust-side: usage fetches carry a key, so they must not go through the
# renderer (no key in the JS heap, no connect-src entry). rustls keeps it
# dependency-light next to everything tauri already pulls in.
ureq = { version = "2", features = ["json"] }
